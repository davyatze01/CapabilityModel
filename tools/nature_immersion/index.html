<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>High Nature Immersion POIs</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  #app { display: flex; height: 100%; }
  #filters { width: 220px; padding: 12px; overflow-y: auto; border-right: 1px solid #ccc; box-sizing: border-box; }
  #filters h3 { margin-top: 0; font-size: 14px; }
  #filters label { display: block; font-size: 13px; margin-bottom: 6px; cursor: pointer; }
  #map { flex: 1; }
  #detail { width: 360px; border-left: 1px solid #ccc; display: flex; flex-direction: column; }
  #detail-header { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #ccc; }
  #detail-placeholder { padding: 12px; font-size: 13px; color: #666; }
  #detail-link { display: none; margin: 12px; padding: 10px; text-align: center; background: #2e7d32; color: white; text-decoration: none; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <div id="filters">
    <h3>Tags</h3>
    <div id="filter-list"></div>
  </div>
  <div id="map"></div>
  <div id="detail">
    <div id="detail-header"></div>
    <div id="detail-placeholder">Click a POI to see it on Google Maps.</div>
    <a id="detail-link" target="_blank" rel="noopener">Open Street View ↗</a>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([39.22, 9.11], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markersByTag = {};

fetch('data.json').then(r => r.json()).then(data => {
  const tags = [...new Set(data.map(d => d.tag))].sort();
  const filterList = document.getElementById('filter-list');
  tags.forEach(tag => {
    markersByTag[tag] = L.layerGroup().addTo(map);
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = true;
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) map.addLayer(markersByTag[tag]);
      else map.removeLayer(markersByTag[tag]);
    });
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(' ' + tag));
    filterList.appendChild(label);
  });

  data.forEach(poi => {
    const marker = L.circleMarker([poi.lat, poi.lon], { radius: 5, weight: 1, color: '#2e7d32', fillOpacity: 0.7 });
    marker.on('click', () => showDetail(poi));
    marker.addTo(markersByTag[poi.tag]);
  });
});

function showDetail(poi) {
  document.getElementById('detail-header').textContent = `id ${poi.id} — ${poi.tag}`;
  document.getElementById('detail-placeholder').style.display = 'none';
  const link = document.getElementById('detail-link');
  link.style.display = 'block';
  link.href = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${poi.lat},${poi.lon}`;
}
</script>
</body>
</html>
